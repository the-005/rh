# Web copies of the images uploaded through the admin, the videos compressed
# with HandBrake, their previews, and a new splash video (scripts/process-media.ts).
#
# Every five minutes it asks the site whether anything is queued, and only sets
# up when something is. It proves who it is with a token GitHub signs for each
# run (id-token: write), which the site's Worker checks: no storage key or
# password is kept anywhere. GitHub may start scheduled runs a few minutes
# late, so an upload is processed within about 5–15 minutes.
name: Process media

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One run at a time, so items are never processed twice.
concurrency:
  group: process-media
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # 4K HEVC is slow on GitHub's four cores: allow long videos.
    timeout-minutes: 360
    steps:
      - name: Anything queued?
        id: queue
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rh-pipeline" | jq -r .value)
          queue=$(curl -sSf -H "Authorization: Bearer $token" https://rh.rh-3b6.workers.dev/api/pipeline/queue)
          count=$(echo "$queue" | jq length)
          videos=$(echo "$queue" | jq '[.[] | select(.type == "video" or .type == "preview" or .type == "splash")] | length')
          echo "Queued: $count ($videos videos)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "videos=$videos" >> "$GITHUB_OUTPUT"

      - if: steps.queue.outputs.count != '0'
        uses: actions/checkout@v4

      - if: steps.queue.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.queue.outputs.count != '0'
        run: npm ci

      - if: steps.queue.outputs.videos != '0'
        name: Install HandBrake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq handbrake-cli ffmpeg
          HandBrakeCLI --version

      - if: steps.queue.outputs.count != '0'
        # Node 22.14 (.nvmrc) runs TypeScript only with this flag.
        run: node --experimental-strip-types scripts/process-media.ts
