<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rh wip</title>
  <meta
        name="description"
        content="An infinite 3D canvas built with React Three Fiber for exploring and displaying media in a seamless, immersive space." />
  <meta name="keywords" content="" />
  <meta name="author" content="Codrops" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="preload" href="/fonts/neue-haas-grotesk-text/regular.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Decided here, before anything paints: whether the intro splash plays
    // (the gallery's own address, first visit only). Under it the ground is
    // black, as its video opens on black; everywhere else it's white, like the
    // canvas and every page, so nothing flashes black while the site loads.
    // src/app reads the class; src/splash sets the key once the video plays.
    var splash = location.pathname === '/';
    try {
      splash = splash && localStorage.getItem('rh:splash-seen') !== '1';
    } catch (e) {}
    document.documentElement.className = splash ? 'js splash' : 'js';
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/index.tsx"></script>
</body>

</html>
