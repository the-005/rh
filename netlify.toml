# Netlify is off (5 Nov): staging is on Cloudflare (see CLAUDE.md, Hosting).
# Until the site is deleted in Netlify's dashboard, this forwards every old
# Netlify address to the same page on Cloudflare, and Netlify builds only
# when this file changes, so pushes to main no longer redeploy it.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml"
  command = "mkdir -p netlify-off && echo '<!doctype html><title>rh</title><a href=\"https://rh.rh-3b6.workers.dev/\">rh.rh-3b6.workers.dev</a>' > netlify-off/index.html"
  publish = "netlify-off"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "https://rh.rh-3b6.workers.dev/:splat"
  status = 301
  force = true
